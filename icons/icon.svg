<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Wallet icon -->
  <g transform="translate(128, 140) scale(1.0)">
    <!-- Wallet body -->
    <rect x="20" y="60" width="220" height="150" rx="20" fill="url(#wallet)"/>
    <!-- Wallet flap -->
    <path d="M20 100 L20 80 Q20 60 40 60 L200 60 Q220 60 230 80 L240 100 Q250 120 230 140 L30 140 Q10 140 10 120 Z" fill="#fff" opacity="0.9"/>
    <!-- Card slot -->
    <rect x="160" y="110" width="60" height="50" rx="8" fill="#6366f1"/>
    <!-- Coin/money detail -->
    <circle cx="190" cy="135" r="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
    <text x="190" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">$</text>
  </g>
</svg>
